<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build WebApp - Policz aktualny build</title>
    <style>
        :root {
            --bg: #f5efe4;
            --panel: #fffaf1;
            --line: #d9c8aa;
            --accent: #8a4b08;
            --accent-soft: #f0ddbf;
            --text: #2a241d;
            --muted: #70604f;
            --error: #8d1b1b;
            --error-bg: #fde8e8;
            --success-bg: #e6f3ea;
            --success-text: #245238;
            --warning-bg: #f8e9cc;
            --warning-text: #8b5a16;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top right, rgba(138, 75, 8, 0.14), transparent 26%),
                linear-gradient(180deg, #faf6ef 0%, var(--bg) 100%);
        }

        .layout {
            max-width: 1460px;
            margin: 0 auto;
            padding: 18px 16px 40px;
        }

        .layout.current-build-wide {
            width: min(100% - 24px, 1840px);
            max-width: 1840px;
            padding-left: 12px;
            padding-right: 12px;
            padding-bottom: 72px;
        }

        .app-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
            padding: 14px 16px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: rgba(255, 250, 241, 0.94);
            box-shadow: 0 10px 20px rgba(92, 63, 22, 0.05);
        }
        .app-nav-title { font-weight: 800; }
        .app-nav-links { display: flex; flex-wrap: wrap; gap: 10px; }
        .app-nav-link {
            padding: 10px 14px;
            border-radius: 999px;
            text-decoration: none;
            color: var(--text);
            background: #fff;
            border: 1px solid rgba(42, 36, 29, 0.08);
            font-weight: 700;
        }
        .app-nav-link-active {
            background: linear-gradient(135deg, #7c3f00 0%, #a95e10 100%);
            color: #fff9f2;
        }

        .hero {
            margin-bottom: 10px;
        }

        .eyebrow {
            display: inline-block;
            margin-bottom: 10px;
            padding: 6px 10px;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        h1, h2, h3, h4 {
            margin-top: 0;
        }

        .hero h1 {
            margin-bottom: 8px;
            font-size: 2rem;
        }

        p {
            line-height: 1.55;
        }

        .hero p {
            max-width: 760px;
            color: var(--muted);
        }

        .panel {
            margin-bottom: 18px;
            padding: 18px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: rgba(255, 250, 241, 0.96);
            box-shadow: 0 12px 24px rgba(92, 63, 22, 0.06);
        }

        .panel-error {
            border-color: rgba(141, 27, 27, 0.28);
            background: var(--error-bg);
        }

        .panel-success {
            border-color: rgba(36, 82, 56, 0.18);
            background: var(--success-bg);
            color: var(--success-text);
        }

        .panel-warning {
            border-color: rgba(139, 90, 22, 0.22);
            background: var(--warning-bg);
            color: var(--warning-text);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
            align-items: end;
        }

        label {
            display: grid;
            gap: 8px;
            font-weight: 600;
        }

        select,
        input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fff;
            color: var(--text);
            font: inherit;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 44px;
            padding: 8px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fff;
            font-weight: 500;
        }

        .checkbox-row input {
            width: 18px;
            height: 18px;
            margin: 0;
        }

        .helper {
            margin-top: 10px;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .hero-links,
        .submit-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 14px;
        }

        button,
        .nav-link {
            display: inline-block;
            border: none;
            border-radius: 999px;
            padding: 12px 18px;
            background: linear-gradient(135deg, #7c3f00 0%, #a95e10 100%);
            color: #fff9f2;
            font: inherit;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }

        .secondary-button,
        .secondary-link {
            background: #ead7b8;
            color: #57330c;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 12px;
        }

        .compact-grid {
            margin-bottom: 14px;
        }

        .layer-panel {
            margin-top: 18px;
            padding: 18px;
            border: 1px solid rgba(112, 96, 79, 0.18);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.74);
        }

        .layer-panel-emphasis {
            border-color: rgba(138, 75, 8, 0.42);
            background: linear-gradient(180deg, rgba(240, 221, 191, 0.52) 0%, rgba(255, 250, 241, 0.96) 100%);
            box-shadow: inset 0 0 0 1px rgba(138, 75, 8, 0.08);
        }

        .layer-heading {
            display: flex;
            gap: 14px;
            align-items: flex-start;
            margin-bottom: 14px;
        }

        .layer-index {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 999px;
            background: var(--accent);
            color: #fff9f2;
            font-weight: 700;
            flex: 0 0 auto;
        }

        .formula-strip {
            margin-bottom: 14px;
            padding: 10px 12px;
            border-radius: 12px;
            background: rgba(138, 75, 8, 0.1);
            color: var(--accent);
            font-weight: 700;
        }

        .summary-card {
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #fff;
        }

        .summary-label {
            color: var(--muted);
            font-size: 0.88rem;
            margin-bottom: 6px;
        }

        .summary-value {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .summary-source {
            margin-top: 8px;
            color: var(--muted);
            font-size: 0.84rem;
            line-height: 1.35;
        }

        .subpanel {
            margin-top: 0;
            padding-top: 0;
            border-top: none;
        }

        .equipment-shell {
            display: grid;
            grid-template-columns: minmax(0, 1.55fr) minmax(260px, 0.85fr);
            gap: 16px;
            align-items: start;
        }

        .panel-build-workspace {
            padding-top: 14px;
        }

        .hero-context-panel-compact {
            padding: 16px 18px;
        }

        .hero-context-head {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 12px;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .hero-context-head .helper {
            margin-top: 6px;
            max-width: 760px;
        }

        .hero-context-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 14px;
        }

        .hero-context-inline-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 12px;
        }

        .hero-context-inline-actions-single {
            grid-template-columns: minmax(280px, 520px);
        }

        .inline-action-form {
            display: grid;
            gap: 10px;
            padding: 14px;
            border: 1px solid rgba(112, 96, 79, 0.18);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.82);
        }

        .equipment-top-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }

        .equipment-paperdoll {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px 20px;
            align-items: start;
        }

        .equipment-column {
            display: grid;
            gap: 12px;
        }

        .equipment-column-left {
            align-content: start;
        }

        .equipment-column-right {
            align-content: start;
        }

        .equipment-slot {
            padding: 16px;
            border: 1px solid rgba(112, 96, 79, 0.18);
            border-radius: 16px;
            background: #fff;
            min-height: 220px;
        }

        .slot-header {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .slot-kicker {
            display: inline-block;
            margin-bottom: 6px;
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .status-active {
            background: #d8edf2;
            color: #1e5566;
        }

        .status-empty {
            background: #f3eadf;
            color: #8a4b08;
        }

        .slot-item-name {
            margin: 0 0 6px;
            font-size: 1.02rem;
            font-weight: 700;
        }

        .slot-item-empty {
            color: var(--muted);
        }

        .slot-helper {
            margin: 0 0 10px;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .slot-contribution {
            margin: 0 0 14px;
            padding: 10px 12px;
            border-radius: 12px;
            background: rgba(240, 221, 191, 0.42);
            color: #6d4416;
            font-size: 0.92rem;
            font-weight: 600;
        }

        .slot-contribution-block {
            display: grid;
            gap: 10px;
            margin: 0 0 14px;
        }

        .slot-contribution-section {
            display: grid;
            gap: 6px;
        }

        .slot-contribution-title {
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .slot-chip-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .slot-chip {
            display: inline-flex;
            align-items: center;
            min-height: 28px;
            padding: 5px 8px;
            border: 1px solid rgba(112, 96, 79, 0.18);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.78);
            color: #4d3724;
            font-size: 0.84rem;
            font-weight: 650;
            line-height: 1.2;
        }

        .slot-select-label {
            margin-top: auto;
        }

        .slot-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
        }

        .slot-select-label select {
            min-height: 46px;
        }

        .hero-stat-list-group {
            display: grid;
            gap: 12px;
        }

        .active-affix-section {
            display: grid;
            gap: 8px;
        }

        .active-affix-section h4 {
            margin: 0;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .active-affix-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .active-affix-list li {
            padding: 8px 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fff;
            color: #3f3024;
            font-weight: 650;
            line-height: 1.25;
        }

        .equipment-side-panel {
            padding: 16px;
            border: 1px solid rgba(112, 96, 79, 0.18);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.82);
        }

        .section-head-inline {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 12px;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .skill-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: end;
            margin-bottom: 16px;
        }

        .skill-toolbar label {
            min-width: 240px;
            flex: 1 1 260px;
        }

        .assigned-skills-grid {
            display: grid;
            gap: 14px;
        }

        .skill-card {
            padding: 16px;
            border: 1px solid rgba(112, 96, 79, 0.18);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.92);
        }

        .skill-card-head {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 12px;
            align-items: flex-start;
            margin-bottom: 14px;
        }

        .tree-skill-data {
            margin: 12px 0 14px;
            padding: 14px;
            border: 1px solid rgba(138, 75, 8, 0.18);
            border-radius: 14px;
            background: rgba(240, 221, 191, 0.22);
        }

        .tree-skill-data-head {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 14px;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 12px;
        }

        .runtime-warning {
            margin: 0;
            color: var(--warning-text);
            font-size: 0.9rem;
            font-weight: 700;
        }

        .tree-modifier-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 8px 0 0;
            padding: 0;
            list-style: none;
        }

        .tree-modifier {
            padding: 6px 10px;
            border: 1px solid rgba(112, 96, 79, 0.18);
            border-radius: 999px;
            background: #fff;
            color: var(--text);
            font-size: 0.9rem;
            font-weight: 700;
            cursor: help;
        }

        .tree-effect-group {
            margin-top: 12px;
        }

        .tree-effect-label {
            display: block;
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .current-skill-state-message,
        .no-active-modifiers {
            margin: 10px 0 0;
            color: var(--muted);
            font-weight: 700;
        }

        .runtime-config-label {
            margin: 10px 0 8px;
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .skill-point-panel {
            padding: 22px;
            border-color: rgba(40, 106, 77, 0.18);
            background: rgba(226, 239, 232, 0.45);
        }

        .skill-point-fields {
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            align-items: end;
            gap: 18px;
            margin-bottom: 20px;
        }

        .skill-point-summary {
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            align-items: stretch;
            gap: 16px;
        }

        .current-build-details {
            margin-top: 14px;
            border: 1px solid rgba(112, 96, 79, 0.18);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.68);
            overflow: clip;
        }

        .current-build-details > summary {
            cursor: pointer;
            padding: 14px 16px;
            color: var(--accent);
            font-weight: 800;
            list-style-position: inside;
        }

        .current-build-details[open] > summary {
            border-bottom: 1px solid rgba(112, 96, 79, 0.14);
            background: rgba(240, 221, 191, 0.34);
        }

        .current-build-details > section {
            margin: 0;
            border: none;
            border-radius: 0;
            box-shadow: none;
        }

        .hero-context-details {
            margin-bottom: 16px;
            background: rgba(255, 250, 241, 0.96);
        }

        .skill-point-status {
            margin: 12px 0 0;
            font-weight: 800;
        }

        .skill-point-status-ok {
            color: var(--success-text);
        }

        .skill-point-status-error {
            color: var(--error);
        }

        .current-build-sticky-actions {
            position: sticky;
            top: 10px;
            z-index: 20;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            padding: 12px 14px;
            border: 1px solid rgba(138, 75, 8, 0.24);
            border-radius: 16px;
            background: rgba(255, 250, 241, 0.96);
            box-shadow: 0 14px 30px rgba(92, 63, 22, 0.12);
            backdrop-filter: blur(8px);
        }

        .current-build-sticky-actions p {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .current-build-sticky-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .empty-state {
            padding: 18px;
            border: 1px dashed rgba(112, 96, 79, 0.28);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.74);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.94rem;
        }

        .data-table th,
        .data-table td {
            padding: 10px 8px;
            border-bottom: 1px solid rgba(112, 96, 79, 0.18);
            text-align: left;
            vertical-align: top;
        }

        .data-table thead th {
            color: var(--muted);
            font-weight: 700;
        }

        .trace-table td:last-child {
            width: 220px;
            min-width: 220px;
        }

        .trace-resource-cell {
            display: grid;
            gap: 3px;
            min-width: 112px;
        }

        .trace-resource-line {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            line-height: 1.25;
        }

        .trace-resource-label {
            color: var(--muted);
            font-size: 0.82rem;
        }

        .trace-resource-value {
            font-weight: 800;
            white-space: nowrap;
        }

        .trace-resource-positive {
            color: var(--success-text);
        }

        .trace-resource-negative {
            color: var(--error);
        }

        .trace-bar-state-details {
            max-width: 360px;
        }

        .trace-bar-state-details > summary {
            cursor: pointer;
            color: var(--accent);
            font-weight: 800;
        }

        .trace-bar-state-details[open] > summary {
            margin-bottom: 8px;
        }

        .bar-state-list {
            display: grid;
            gap: 6px;
        }

        .bar-state-item {
            padding: 8px 10px;
            border-radius: 10px;
            background: rgba(240, 221, 191, 0.48);
        }

        .error-list,
        .message-list {
            margin: 0;
            padding-left: 20px;
        }

        .error-list {
            color: var(--error);
        }

        .muted {
            color: var(--muted);
        }

        @media (max-width: 1180px) {
            .equipment-paperdoll { grid-template-columns: 1fr; }
        }

        @media (max-width: 900px) {
            .data-table,
            .data-table thead,
            .data-table tbody,
            .data-table tr,
            .data-table th,
            .data-table td {
                display: block;
            }

            .data-table thead {
                display: none;
            }

            .data-table tr {
                margin-bottom: 12px;
                padding: 10px;
                border: 1px solid rgba(112, 96, 79, 0.18);
                border-radius: 12px;
                background: #fff;
            }

            .data-table td {
                border: none;
                padding: 6px 0;
            }
        }
        {{APP_SHELL_STYLES}}
    </style>
</head>
<body>
<main class="layout current-build-wide">
    {{GLOBAL_NAV}}

    {{HERO_CONTEXT}}
    {{FORM_MESSAGES}}
    {{ENTRY_SECTION}}

    {{FORM_ERRORS}}

    {{RESULT_SECTION}}
</main>
</body>
</html>
